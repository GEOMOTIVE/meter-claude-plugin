name: Validate plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate-package.py
      - run: python3 scripts/build-openai-package.py --check
      - run: python3 scripts/package-releases.py
      - run: python3 scripts/validate-archives.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @anthropic-ai/claude-code@2.1.212 plugin validate .claude-plugin/plugin.json
      - run: npx --yes @anthropic-ai/claude-code@2.1.212 plugin validate .claude-plugin/marketplace.json
      - run: npx --yes @openai/codex@0.153.4 plugin marketplace add . --json
      - run: npx --yes @openai/codex@0.153.4 plugin add meter@meter-public --json
      - uses: actions/upload-artifact@v4
        with:
          name: meter-packages
          path: dist/
